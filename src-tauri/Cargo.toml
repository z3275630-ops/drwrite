[package]
name = "drwrite"
version = "0.7.4"
description = "Drwrite —— 给长篇小说作者的本地写作台"
edition = "2021"

# 大版本升级时看 https://tauri.app/start/update/

[lib]
name = "drwrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AI 网关用的轻量 HTTP 客户端（OpenAI 兼容接口直连，绕开 WebView 的 CORS 限制）
ureq = { version = "2", features = ["json"] }
encoding_rs = "0.8"

[profile.release]
# 体积优先，桌面工具不值得为几毫秒牺牲体积
opt-level = "s"
lto = true
codegen-units = 1
strip = true
